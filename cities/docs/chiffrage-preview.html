<!doctype html>
<html data-chiffrage-assets="../" lang="fr" data-skin="prime-darkweb">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chiffrage · aperçu de contrôle</title>
<link rel="stylesheet" href="../app/styles/main.css">
<style>body{margin:0;padding:16px}.preview-tools{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;font:14px system-ui}.preview-tools button,.preview-tools select{padding:8px;min-height:40px}iframe{display:block;border:1px solid #777;height:768px;background:#141d2b}.preview-note{font:14px system-ui;color:var(--skin-muted)}</style>
</head><body>
<script type="module">
// Isolated QA fixture: invented prices and an in-memory API, never production data.
const params = new URLSearchParams(location.search);
if (!params.has('frame')) {
  document.body.innerHTML = `<h1>Aperçu du chiffrage</h1><p class="preview-note">Commune et prix fictifs. Les sauvegardes de cet aperçu restent en mémoire.</p><div class="preview-tools"><label>Largeur <select id="width">${[360,430,768,1366,1920,2560].map(w => `<option ${w===1366?'selected':''}>${w}</option>`).join('')}</select></label><label>Apparence <select id="skin"><option value="prime-darkweb">Prime Dark</option><option value="helvetia">Helvetia Hell</option></select></label><label>Langue <select id="language"><option value="fr">Français</option><option value="de">Deutsch</option></select></label></div><iframe title="Chiffrage fictif" id="preview" width="1366" src="?frame=1&view=chiffrage"></iframe>`;
  const frame = document.querySelector('iframe');
  document.querySelector('#width').onchange = e => { frame.width=e.target.value; frame.style.height=({360:780,430:932,768:1024,1366:768,1920:1080,2560:1440}[e.target.value])+'px'; };
  const reload = () => frame.src = `?frame=1&view=chiffrage&skin=${document.querySelector('#skin').value}&language=${document.querySelector('#language').value}`;
  document.querySelector('#skin').onchange = reload;
  document.querySelector('#language').onchange = reload;
} else {
  localStorage.setItem('prime-communes-skin', params.get('skin') || 'prime-darkweb');
  localStorage.setItem('prime-communes-language', params.get('language') || 'fr');
  document.body.innerHTML = '<p class="preview-note">APERÇU · Commune et prix fictifs · aucune donnée enregistrée sur le serveur</p><button data-view="chiffrage" hidden>Chiffrage</button><section class="chiffrage-view"><div id="chiffrageRoot"></div></section>';
  window.PrimeCommunesRuntime = {
    escapeHtml: value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
    rows: [{ id: 6757, name: 'Saignelégier', canton: 'JU', expectedPopulation: 4501 }]
  };
  window.openDrawer = () => {};
  window.SUPABASE_URL = 'https://chiffrage-preview.invalid';
  const { calculateQuote } = await import('../app/chiffrage/calculate.js');
  const item = (vendor,product,item_code,label_fr,default_selected=true) => ({ vendor,
    product,item_code,label_fr,default_selected,pricing_rule:{kind:'lookup',basis:'population',
      below_first:'hold',tiers:[{up_to:100000,value:1000}]}});
  const catalog = { items: [item('innosolv','Gemeinde','1','Système de base'),
    item('innosolv','Gemeinde','21','Intégration Abacus',false),item('innosolv','Gemeinde','22','Intégration ProConcept',false),
    item('abacus','ERP','TEST','Comptabilité'),...['501','502','533'].map(code => ({
      ...item('innosolv','Versorger',code,`Licence énergie ${code}`,false),
      pricing_rule:{kind:'unverified',basis:'meters',tiers:[{up_to:5000,value:1000}]}}))],
    parameters: {configuration_profiles:[{id:'demo',label:'Référence de démonstration',default:true,source:'Données fictives',services:[{family:'prestations',item_code:'reprise',label:'Reprise de données',days:3,suggested_days:3},{family:'prestations',item_code:'formation',label:'Formation',days:2,suggested_days:2},{family:'prestations',item_code:'demarrage',label:'Assistance au démarrage',days:2,suggested_days:2}],project_management:{percent:10,basis:'prime_service_days',round_days:1,exclude_codes:['deplacements']}}],hosting_presets:[{lines:[{family:'prime',category:'hosting',label:'Hébergement · démonstration',quantity:1,investment_pv:500,annual_pv:1200}]}],day_rate:1000,publisher_rent:{innosolv:{standard:{pa_rate:.1,pv_rate:.2}},
      abacus:{standard:{pa_rate:.1,pv_rate:.2}}},service_presets:{standard:{'innosolv/Gemeinde/1':2,'innosolv/Gemeinde/21':1,'innosolv/Gemeinde/22':1,'abacus/ERP/TEST':3}},
      sql:{suggestion:{lowerPopulation:1000,lowerUsers:2,upperPopulation:9000,upperUsers:10},
        core_from_population:8000,user_base:100,price_per_user:20,default_cores:2,price_per_core:null},
      pce:{finance_ratio:.4,finance_adjustment:100,finance_round_to:100,salary_round_to:50,pv_margin:.2,pv_round_to:50},
      oracle:{full_price:100,light_price:50,full_maintenance:10,light_maintenance:5},
      lcm:[{up_to:5000,gold:1000,platinium:2000},{up_to:100000,gold:3000,platinium:5000}]}};
  // Real municipality for geographic QA; every price, volume and quotation below is invented.
  const domains = [
    ['10510','Comptabilité financière','Finanzbuchhaltung'],
    ['10520','Comptabilité des débiteurs','Debitorenbuchhaltung'],
    ['10530','Comptabilité des créanciers','Kreditorenbuchhaltung'],
    ['10540','Comptabilité des salaires','Lohnbuchhaltung'],
    ['10570','Comptabilité des immobilisations','Anlagenbuchhaltung'],
    ['10566','Gestion des projets','Projektverwaltung']
  ];
  const options = [
    ['Budgétisation étendue','Erweiterte Budgetierung'],['Contrôle des visas et validation','Visumskontrolle und Freigabe'],
    ['Archivage électronique des documents','Elektronische Dokumentenarchivierung'],
    ['Interface AbaConnect avec le logiciel communal','AbaConnect-Schnittstelle zur Gemeindesoftware'],
    ['Rapports et analyses métier','Fachberichte und Auswertungen'],['Reprise et contrôle des données','Datenübernahme und Kontrolle']
  ];
  for (const [code, fr, de] of domains) {
    const entries = [[`${code}.1`,fr,de], ...options.map(([fr,de],i)=>[`${code}.${201+i}`,fr,de])];
    for (const [code,fr,de] of entries) {
      catalog.items.push({...item('abacus','ERP',code,fr),label_de:de,catalog_version:'QA · tarifs fictifs'});
      catalog.parameters.service_presets.standard[`abacus/ERP/${code}`]=1;
    }
  }
  catalog.items.forEach(row=>{row.label_de ??= row.label_fr;row.catalog_version ??= 'QA · tarifs fictifs';});
  const makeSample = index => {
    const modules = catalog.items.filter(row=>row.vendor==='abacus' || row.item_code==='1')
      .filter((row,i)=>index!==1 || i%3!==1).map(({vendor,product,item_code})=>({vendor,product,item_code}));
    const input = {bfs_id:6757,name:'Saignelégier',canton:'JU',reference:{id:'demo',label:'Référence de démonstration'},
      dimensions:{population:4501,licensedPopulation:4501,meters:5000,taxes:5000,employees:index===2?60:40},
      products:['innosolv','abacus',...(index===2?['pce']:[])],modules,
      moduleServices:modules.map(row=>({family:'prestations_module',item_code:`${row.vendor}/${row.product}/${row.item_code}`,label:'Prestations de démonstration',days:1,suggested_days:1})),
      services:[{family:'prestations',item_code:'formation',label:'Formation',days:index===2?8:4,suggested_days:4}],
      primeLines:Array.from({length:5},(_,i)=>({family:'prime',item_code:`demo-${i}`,label:['Guichet virtuel et démarches en ligne','Signature électronique','Archivage et gestion documentaire','Connecteur de paiement','Interface partenaire'][i],investment_pv:1000+i*500,annual_pv:100+i*50,quantity:1})),
      partners:[],pce:{finances:true,salaires:false,interfacePa:0},oracle:{full:5,light:0},sql:{},lcm:{selection:index===2?'gold':'none'},energy:false,hosting:{included:false}};
    if(params.get('case')==='bex') {
      input.name='Bex';input.bfs_id=5402;input.canton='VD';input.dimensions.population=9500;input.dimensions.licensedPopulation=10000;
      input.services.push({family:'prestations',item_code:'interfaces',label:'Interfaces',days:null,suggested_days:0});
      const missing=input.moduleServices.find(row=>row.item_code==='abacus/ERP/10510.1');
      missing.days=null;missing.suggested_days=null;delete catalog.parameters.service_presets.standard[missing.item_code];
    }
    if(params.get('noReference')==='1') delete input.reference;
    const result=calculateQuote(input,catalog);
    if(index===2 && params.get('incomplete')==='1')result.status='incomplete';
    return {id:`synthetic-${index}`,title:index===2?'Accompagnement renforcé':'Saignelégier — Variante 1',current_revision:index+1,commune_name:input.name,bfs_id:input.bfs_id,
      snapshot:{input,catalog_versions:{synthetic:'00000000-0000-4000-8000-000000000001'},result}};
  };
  const samples=[0,1,2].map(makeSample);
  let saved = null, expired = false, listFailure = false;
  const response = (value,status=200) => new Response(JSON.stringify(value),{status,
    headers:{'content-type':'application/json'}});
  const fetchAsset=window.fetch.bind(window);
  window.fetch = async (url,options={}) => {
    const target = new URL(url,location.href);
    if (target.hostname === 'www.wikidata.org') return fetchAsset(url,options);
    const action = target.searchParams.get('action');
    if (!action && new URL(url).pathname.endsWith('/swiss-map-v1.json')) return fetchAsset(url,options);
    if (action === 'login') { expired=false;return response({session:'synthetic-session'}); }
    if (expired) return response({error:'Authentication required'},401);
    if (action === 'status') return response({authenticated:true});
    if (action === 'catalog') return response({active:{synthetic:'00000000-0000-4000-8000-000000000001'},catalog});
    if (action === 'list') return listFailure ? response({},503) : response([...samples,...(saved?[saved]:[])].map(({snapshot,...metadata})=>metadata));
    if (action === 'quote' && params.get('snapshotFailure') === '1') return response({},503);
    if (action === 'quote') return response(samples.find(row=>row.id===target.searchParams.get('id'))??saved);
    if (action === 'save') {
      const value=JSON.parse(options.body);let result;
      try {result=calculateQuote(value.input,catalog);} catch {result={status:'incomplete'};}
      saved={id:'synthetic-quote',title:value.title,current_revision:(saved?.current_revision??0)+1,
        snapshot:{input:value.input,catalog_versions:value.catalog_versions,result},
        commune_name:value.input.name,bfs_id:value.input.bfs_id};
      return response({id:saved.id,revision:saved.current_revision,result});
    }
    if(action==='publishOffer')return response({token:'test-only-token',expires_at:'2099-01-01T00:00:00Z'});
    if(action==='sharedOffers')return response([]);
    if(action==='revokeOffer')return response({revoked:true});
    if(action==='revisions')return response([{revision:1,created_at:'2026-10-24'}]);
    if(action==='export')return response({code:'quoteIncomplete'},422);
    return response({});
  };
  const tools=document.createElement('div'); tools.className='preview-tools';
  tools.innerHTML='<button id="expired">Simuler une session expirée</button><button id="listFailure">Simuler une panne de liste après sauvegarde</button>';
  document.body.prepend(tools);
  tools.querySelector('#expired').onclick=()=>expired=true;
  tools.querySelector('#listFailure').onclick=()=>listFailure=true;
  await import('../app/chiffrage/view.js');
  if(params.get('scenario')!=='loaded')document.dispatchEvent(new CustomEvent('prime:chiffrage-commune',{
    detail:window.PrimeCommunesRuntime.rows[0]}));
}
</script></body></html>
