<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prime Communes — harnais de recette</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #111827; }
    body { display: grid; place-items: start center; }
    iframe { display: block; border: 0; background: #07111e; }
  </style>
</head>
<body>
  <iframe id="app" title="Prime Communes"></iframe>
  <script>
    const query = new URLSearchParams(location.search);
    const clamp = (value, minimum, maximum, fallback) => {
      if (value === null || value === '') return fallback;
      const number = Number(value);
      return Number.isFinite(number) ? Math.min(maximum, Math.max(minimum, number)) : fallback;
    };
    const width = clamp(query.get('width'), 320, 2560, 1366);
    const height = clamp(query.get('height'), 568, 1800, 900);
    const scale = clamp(query.get('scale'), 0.25, 1, 1);
    const frame = document.querySelector('#app');
    frame.width = String(width);
    frame.height = String(height);
    frame.src = '../index.html' + (query.get('view') ? '?view=' + encodeURIComponent(query.get('view')) : '');
    frame.style.transform = `scale(${scale})`;
    frame.style.transformOrigin = 'top center';
    document.body.style.width = `${Math.ceil(width * scale)}px`;
    document.body.style.minHeight = `${Math.ceil(height * scale)}px`;
  </script>
</body>
</html>
