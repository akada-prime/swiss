<!doctype html><html lang="fr" data-skin="prime-dark"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kanban — recette synthétique</title><link rel="stylesheet" href="../../app/styles/main.css?v=20261112-kanban-r1"><style>body{margin:0;padding:16px;background:var(--skin-bg);color:var(--skin-text);font-family:Arial,sans-serif}#controls{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}#controls label{display:flex;gap:8px;align-items:center}#frame{display:block;border:0;max-width:none}#result{white-space:pre-wrap;font-size:14px}.chiffrage-view{padding:0}</style>
<div id="controls"><label>Largeur <select id="width"><option>360</option><option>430</option><option>768</option><option selected>1366</option><option>1920</option><option>2560</option></select></label><label>Thème <select id="theme"><option value="prime-dark">Prime Dark</option><option value="jura">Jura</option><option value="helvetia">Hell</option></select></label><label>Langue <select id="lang"><option>fr</option><option>de</option></select></label><button id="measure">Mesurer</button></div><pre id="result"></pre><iframe id="frame" title="Recette Kanban"></iframe>
<script type="module">
import {boardHtml,boardRibbon,bindKanban,defaultColumns} from '../../app/chiffrage/kanban.js?v=20261112-kanban-r1';
import {workspaceIdentity} from '../../app/chiffrage/workspace-ui.js?v=20261112-kanban-r1';
const params=new URLSearchParams(location.search),frame=document.querySelector('#frame');
if(!params.has('frame')){
 const refresh=()=>{frame.style.width=document.querySelector('#width').value+'px';frame.style.height='1000px';frame.src='?frame=1&theme='+document.querySelector('#theme').value+'&lang='+document.querySelector('#lang').value;};
 for(const input of document.querySelectorAll('#controls select'))input.onchange=refresh;
 document.querySelector('#measure').onclick=()=>{const d=frame.contentDocument;document.querySelector('#result').textContent=JSON.stringify({width:d.documentElement.clientWidth,bodyWidth:d.body.scrollWidth,columns:d.querySelectorAll('[data-stage]').length,cards:d.querySelectorAll('[data-quote-card]').length},null,2);};refresh();
}else{
 document.querySelector('#controls').remove();document.querySelector('#result').remove();frame.remove();document.documentElement.dataset.skin=params.get('theme');document.documentElement.lang=params.get('lang');
 const root=document.createElement('main');root.className='chiffrage-view';document.body.append(root);const label=(fr,de)=>document.documentElement.lang==='de'?de:fr;
 let rows=[{id:'a',title:'Commune de démonstration — Variante 1',workflow_stage:0,save_number:37,workflow_order:1},{id:'b',title:'Autre commune — Variante 2',workflow_stage:1,save_number:12,workflow_order:1},{id:'c',title:'Dossier de démonstration',workflow_stage:2,save_number:8,workflow_order:1}];let columns=[...defaultColumns],controller;
 const render=()=>{controller?.destroy();root.innerHTML=boardHtml(rows,columns,(row,stage)=>`<article class="chiffrage-list-item" data-quote-card="${row.id}">${boardRibbon(stage,columns[stage])}<button class="chiffrage-card-open"><span class="chiffrage-saved-heading"><strong>${row.title}</strong></span><small>OFS 9999 · #${row.save_number}</small><span class="chiffrage-saved-figures"><span class="chiffrage-saved-parts"><span>Investissement<b>100'680 CHF</b></span><span>Annuel dès N+1<b>34'588 CHF</b></span></span><span class="chiffrage-saved-tco"><span>Total sur 5 ans</span><b>239'032 CHF</b></span></span></button><div class="chiffrage-card-workflow"><button data-drag-handle aria-label="Déplacer">⠿</button><label><span class="chiffrage-visually-hidden">Déplacer vers</span><select data-move-quote="${row.id}" aria-label="Déplacer vers">${columns.map((title,i)=>`<option value="${i}" ${i===stage?'selected':''}>${title}</option>`).join('')}</select></label></div></article>`,label);controller=bindKanban(root,{label,onMove:async(id,stage,before)=>{const row=rows.find(row=>row.id===id);row.workflow_stage=stage;row.workflow_order=before?rows.find(row=>row.id===before).workflow_order-.5:Date.now();render();},onRename:async(index,title)=>{columns[index]=title;render();},onRefresh:async()=>{}});};render();
 const editor=document.createElement('div');editor.className='chiffrage-editor';editor.innerHTML=workspaceIdentity({name:'Commune de démonstration',canton:'VD',bfs:9999,population:"1'500",inhabitants:'habitants',title:'Variante de démonstration',saveNumber:37,identity:'',map:'',reference:'Référence synthétique',tariffs:'Synthétique',label});root.append(editor);
}
</script></html>
