name: Prime Communes live export

on:
  push:
    paths:
      - '.github/workflows/prime-communes-live-export.yml'
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Export GemeindeAktuell
        shell: bash
        run: |
          python - <<'PY'
          import csv, html, json, re, urllib.parse, urllib.request
          from pathlib import Path

          source = Path('cities/index.html').read_text(encoding='utf-8')
          base = re.search(r"const SUPABASE_URL='([^']+)'", source).group(1)
          key = re.search(r"SUPABASE_KEY='([^']+)'", source).group(1)
          endpoint = base + '/rest/v1/GemeindeAktuell?select=*&order=bfs_id'
          rows = []
          start = 0
          while True:
              req = urllib.request.Request(endpoint, headers={
                  'apikey': key,
                  'Range': f'{start}-{start+999}',
                  'Range-Unit': 'items',
              })
              with urllib.request.urlopen(req, timeout=60) as response:
                  page = json.loads(response.read().decode('utf-8'))
              rows.extend(page)
              if len(page) < 1000:
                  break
              start += 1000

          out = Path('live-export')
          out.mkdir(exist_ok=True)
          (out / 'gemeindeaktuell-live.json').write_text(
              json.dumps(rows, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          columns = list(rows[0].keys()) if rows else []
          with (out / 'gemeindeaktuell-live.csv').open('w', encoding='utf-8-sig', newline='') as f:
              writer = csv.DictWriter(f, fieldnames=columns, extrasaction='ignore')
              writer.writeheader()
              for row in rows:
                  clean = dict(row)
                  clean['products'] = ' | '.join(clean.get('products') or [])
                  clean['bezirk'] = html.unescape(clean.get('bezirk') or '')
                  writer.writerow(clean)
          print(f'Exported {len(rows)} rows / {len(columns)} columns')
          PY
      - name: Upload live export
        uses: actions/upload-artifact@v4
        with:
          name: prime-communes-live-export
          path: live-export/
          retention-days: 1
