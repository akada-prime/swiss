name: Prime Communes one-time map fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prime-communes-onetime-map-fix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          js_path = Path('cities/app/prime-communes-maplibre-1.2.js')
          js = js_path.read_text()

          js = replace_once(
              js,
              "  let cantonGeoJSON = null;\n  let pointGeoJSON = null;",
              "  let cantonGeoJSON = null;\n  let countryBorderGeoJSON = null;\n  let pointGeoJSON = null;",
              'country border state'
          )

          helper = r'''
  function buildCountryBorderGeoJSON() {
    const edges = new Map();
    const pointKey = point => `${Number(point[0]).toFixed(7)},${Number(point[1]).toFixed(7)}`;
    const edgeKey = (a, b) => {
      const ka = pointKey(a);
      const kb = pointKey(b);
      return ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`;
    };

    for (const shape of geometry?.cantons || []) {
      for (const ring of parsePathRings(shape.d)) {
        for (let index = 1; index < ring.length; index += 1) {
          const a = ring[index - 1];
          const b = ring[index];
          if (!a || !b || (a[0] === b[0] && a[1] === b[1])) continue;
          const key = edgeKey(a, b);
          const current = edges.get(key);
          if (current) current.count += 1;
          else edges.set(key, { count: 1, coordinates: [a, b] });
        }
      }
    }

    const coordinates = [...edges.values()]
      .filter(edge => edge.count === 1)
      .map(edge => edge.coordinates);

    return {
      type: 'FeatureCollection',
      features: coordinates.length ? [{
        type: 'Feature',
        properties: { boundary: 'switzerland' },
        geometry: { type: 'MultiLineString', coordinates }
      }] : []
    };
  }

'''
          marker = "  function municipalityFeature(shape, lookup) {"
          if marker not in js:
              raise SystemExit('country border helper marker not found')
          js = js.replace(marker, helper + marker, 1)

          js = replace_once(
              js,
              "    cantonGeoJSON = { type: 'FeatureCollection', features: (geometry?.cantons || []).map(cantonFeature).filter(Boolean) };\n  }",
              "    cantonGeoJSON = { type: 'FeatureCollection', features: (geometry?.cantons || []).map(cantonFeature).filter(Boolean) };\n    countryBorderGeoJSON = buildCountryBorderGeoJSON();\n  }",
              'build country border data'
          )

          js = replace_once(
              js,
              "    map?.getSource('cantons')?.setData(cantonGeoJSON);\n  }",
              "    map?.getSource('cantons')?.setData(cantonGeoJSON);\n    map?.getSource('country-border')?.setData(countryBorderGeoJSON);\n  }",
              'sync country border data'
          )

          js = replace_once(
              js,
              "  function romandieBounds() {\n    return boundsFromFeatures(municipalityGeoJSON?.features?.filter(feature => feature.properties.market === 'Welsch')) || [[5.75, 45.78], [7.75, 47.55]];\n  }",
              "  function countryBounds() {\n    return boundsFromFeatures(cantonGeoJSON?.features) || swissBounds();\n  }",
              'country bounds'
          )

          js = replace_once(
              js,
              "    map.setMinZoom(Math.max(0, zoomX, zoomY) + 0.03);",
              "    map.setMinZoom(Math.max(0, Math.min(zoomX, zoomY) - 0.03));",
              'minimum zoom fit logic'
          )

          count = js.count('fitActiveScope')
          if count < 3:
              raise SystemExit(f'fitActiveScope: expected at least 3 matches, found {count}')
          js = js.replace('fitActiveScope', 'fitCountryScope')

          js = replace_once(
              js,
              "  function fitCountryScope() {\n    if (!map || !geometry) return;\n    map.fitBounds(romandieBounds(), { padding: window.matchMedia('(max-width:680px)').matches ? 12 : 28, duration: 380 });\n  }",
              "  function fitCountryScope() {\n    if (!map || !geometry) return;\n    const mobile = window.matchMedia('(max-width:680px)').matches;\n    map.fitBounds(countryBounds(), { padding: mobile ? 10 : 18, duration: 380 });\n  }",
              'fit full Switzerland'
          )

          canton_layers = "    map.addLayer({ id: 'cantons-border-casing', type: 'line', source: 'cantons', paint: { 'line-color': 'rgba(13,28,39,.86)', 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 2.8, 9, 3.5, 12, 4.6], 'line-opacity': 0.82 } });\n    map.addLayer({ id: 'cantons-border', type: 'line', source: 'cantons', paint: { 'line-color': 'rgba(242,249,252,.96)', 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.9, 9, 1.25, 12, 1.85], 'line-opacity': 0.92 } });"
          country_layers = canton_layers + "\n    map.addSource('country-border', { type: 'geojson', data: countryBorderGeoJSON });\n    map.addLayer({ id: 'country-border-casing', type: 'line', source: 'country-border', paint: { 'line-color': 'rgba(5,15,24,.98)', 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 5.2, 9, 6.4, 12, 8.0], 'line-opacity': 0.96 } });\n    map.addLayer({ id: 'country-border', type: 'line', source: 'country-border', paint: { 'line-color': 'rgba(111,203,255,.99)', 'line-width': ['interpolate', ['linear'], ['zoom'], 6, 2.0, 9, 2.7, 12, 3.5], 'line-opacity': 0.99 } });"
          js = replace_once(js, canton_layers, country_layers, 'country border layers')

          js_path.write_text(js)

          css_path = Path('cities/app/prime-communes-maplibre-1.2.css')
          css = css_path.read_text()
          css = replace_once(
              css,
              ".maplibre-stage{position:relative;height:760px;min-height:760px;overflow:hidden;",
              ".maplibre-stage{position:relative;height:clamp(820px,58vw,980px);min-height:820px;overflow:hidden;",
              'desktop map height'
          )
          css_path.write_text(css)

          loader_path = Path('cities/app/prime-communes-1.1.js')
          loader = loader_path.read_text()
          loader = loader.replace("prime-communes-maplibre-1.2.css?v=9", "prime-communes-maplibre-1.2.css?v=10")
          loader = loader.replace("prime-communes-maplibre-1.2.js?v=7", "prime-communes-maplibre-1.2.js?v=8")
          if "prime-communes-maplibre-1.2.css?v=10" not in loader or "prime-communes-maplibre-1.2.js?v=8" not in loader:
              raise SystemExit('loader cache-bust update failed')
          loader_path.write_text(loader)

          test_path = Path('cities/tests/stabilization-1.1.test.mjs')
          tests = test_path.read_text()
          anchor = "  assert.match(js, /map\\.setMaxBounds\\(bounds\\)/);\n"
          addition = anchor + "  assert.match(js, /Math\\.min\\(zoomX, zoomY\\)/);\n  assert.match(js, /country-border-casing/);\n  assert.match(js, /country-border'/);\n  assert.match(js, /map\\.fitBounds\\(countryBounds\\(\\)/);\n  assert.match(css, /height:clamp\\(820px,58vw,980px\\)/);\n"
          if anchor not in tests:
              raise SystemExit('map contract test anchor not found')
          tests = tests.replace(anchor, addition, 1)
          test_path.write_text(tests)
          PY

      - name: Run checks
        working-directory: cities
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit canonical changes and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/prime-communes-onetime-map-fix.yml
          git config user.name "Prime Communes Bot"
          git config user.email "actions@users.noreply.github.com"
          git add cities/app/prime-communes-maplibre-1.2.js cities/app/prime-communes-maplibre-1.2.css cities/app/prime-communes-1.1.js cities/tests/stabilization-1.1.test.mjs .github/workflows/prime-communes-onetime-map-fix.yml
          git commit -m "Fit full Switzerland and emphasize national border"
          git push
