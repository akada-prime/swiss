name: Prime Communes one-time front cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prime-communes-onetime-front-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical front cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          # 1-2) KPI contract: compact desktop cards + neutral context values.
          stats_path = Path('cities/app/prime-communes-stats-1.2.css')
          stats = stats_path.read_text()
          stats = replace_once(stats,
              '  --pc-kpi-accent:#6ec7ff;\n  --pc-kpi-detail-line-height:1.18;',
              '  --pc-kpi-accent:#6ec7ff;\n  --pc-kpi-neutral:#f3f6fa;\n  --pc-kpi-detail-line-height:1.18;',
              'stats neutral token')
          stats = replace_once(stats,
              '  min-height:0;\n  padding:8px 14px 9px;',
              '  height:auto;\n  min-height:0;\n  padding:6px 14px 7px;',
              'compact KPI height')
          stats = replace_once(stats,
              '  color:#f3f6fa;\n  line-height:1;',
              '  color:var(--pc-kpi-neutral);\n  line-height:1;',
              'neutral KPI value')
          stats_path.write_text(stats)

          # 3-5) One semantic empty-cell treatment + shared secondary text token.
          css_path = Path('cities/app/prime-communes-1.1.5.css')
          css = css_path.read_text()
          css = replace_once(css,
              '/* Prime Communes 1.1 · stabilized visual layer */\n',
              '/* Prime Communes 1.1 · stabilized visual layer */\n\n:root{\n  --pc-table-secondary:#a9b5c5;\n  --pc-table-empty:#708095;\n}\n',
              'table text tokens')
          css = replace_once(css,
              '.metier-cell,.erp-cell,.modules-cell,.hosting-cell{\n  vertical-align:middle;\n  min-width:120px;\n}\n.hosting-cell{\n  color:#a9b5c5;\n  white-space:nowrap;\n}',
              '.metier-cell,.erp-cell,.modules-cell,.hosting-cell{\n  vertical-align:middle;\n  min-width:120px;\n  color:var(--pc-table-secondary);\n}\n.hosting-cell{\n  white-space:nowrap;\n}\n.cell-empty{\n  color:var(--pc-table-empty);\n}',
              'table semantic colors')
          css = css.replace('  color:#98a4b5;\n  background:transparent;', '  color:var(--pc-table-secondary);\n  background:transparent;')
          css_path.write_text(css)

          communes_path = Path('cities/app/prime-communes-communes-1.2.js')
          communes = communes_path.read_text()
          marker = "  render = function renderCommunesView() {\n    baseRender();\n    decorateCommuneIdentity();\n    decorateHostingColumn();\n  };"
          replacement = """  function decorateEmptyCells() {
    document.querySelectorAll('.erp-cell,.modules-cell,.hosting-cell').forEach(cell => {
      cell.classList.toggle('cell-empty', cell.textContent.trim() === '—');
    });
  }

  render = function renderCommunesView() {
    baseRender();
    decorateCommuneIdentity();
    decorateHostingColumn();
    decorateEmptyCells();
  };"""
          communes = replace_once(communes, marker, replacement, 'empty cell semantics')
          communes_path.write_text(communes)

          # 6) National border from exterior canton rings only. Interior holes/lakes
          # never become national borders.
          map_path = Path('cities/app/prime-communes-maplibre-1.2.js')
          js = map_path.read_text()
          js = js.replace("  const COUNTRY_BORDER_URL = 'public/data/switzerland-border-2026.geojson';\n", '')
          js = re.sub(
              r"  const countryBorderPromise = fetch\(COUNTRY_BORDER_URL, \{ cache: 'force-cache' \}\)\n    \.then\(response => \{\n      if \(!response\.ok\) throw new Error\('Frontière nationale indisponible\.'\);\n      return response\.json\(\);\n    \}\);\n",
              '', js, count=1)

          helper = r'''
  function ringSignedArea(ring) {
    let area = 0;
    for (let index = 1; index < ring.length; index += 1) {
      const a = ring[index - 1];
      const b = ring[index];
      area += (a[0] * b[1]) - (b[0] * a[1]);
    }
    return area / 2;
  }

  function exteriorRings(shape) {
    const rings = parsePathRings(shape?.d);
    if (!rings.length) return [];
    const areas = rings.map(ring => ringSignedArea(ring));
    const largestIndex = areas.reduce((best, area, index) =>
      Math.abs(area) > Math.abs(areas[best] || 0) ? index : best, 0);
    const outerSign = Math.sign(areas[largestIndex]) || 1;
    return rings.filter((ring, index) => (Math.sign(areas[index]) || outerSign) === outerSign);
  }

  function buildCountryBorderGeoJSON() {
    const edges = new Map();
    const pointKey = point => `${Number(point[0]).toFixed(7)},${Number(point[1]).toFixed(7)}`;
    const edgeKey = (a, b) => {
      const ka = pointKey(a);
      const kb = pointKey(b);
      return ka < kb ? `${ka}|${kb}` : `${kb}|${ka}`;
    };

    for (const shape of geometry?.cantons || []) {
      for (const ring of exteriorRings(shape)) {
        for (let index = 1; index < ring.length; index += 1) {
          const a = ring[index - 1];
          const b = ring[index];
          if (!a || !b || (a[0] === b[0] && a[1] === b[1])) continue;
          const key = edgeKey(a, b);
          const current = edges.get(key);
          if (current) current.count += 1;
          else edges.set(key, { count: 1, coordinates: [a, b] });
        }
      }
    }

    const coordinates = [...edges.values()]
      .filter(edge => edge.count === 1)
      .map(edge => edge.coordinates);

    return {
      type: 'FeatureCollection',
      features: coordinates.length ? [{
        type: 'Feature',
        properties: { boundary: 'switzerland' },
        geometry: { type: 'MultiLineString', coordinates }
      }] : []
    };
  }

'''
          anchor = "  function municipalityFeature(shape, lookup) {"
          if 'function buildCountryBorderGeoJSON()' not in js:
              js = replace_once(js, anchor, helper + anchor, 'country border helper')

          js = replace_once(js,
              "    cantonGeoJSON = { type: 'FeatureCollection', features: (geometry?.cantons || []).map(cantonFeature).filter(Boolean) };\n  }",
              "    cantonGeoJSON = { type: 'FeatureCollection', features: (geometry?.cantons || []).map(cantonFeature).filter(Boolean) };\n    countryBorderGeoJSON = buildCountryBorderGeoJSON();\n  }",
              'country border build')
          js = replace_once(js,
              "      const [, , officialBorder] = await Promise.all([waitForData(), ensureGeometry(), countryBorderPromise]);\n      countryBorderGeoJSON = officialBorder;",
              "      await Promise.all([waitForData(), ensureGeometry()]);",
              'remove external border fetch')
          map_path.write_text(js)

          # Bump all touched canonical assets so browsers cannot keep stale layouts.
          loader_path = Path('cities/app/prime-communes-1.1.js')
          loader = loader_path.read_text()
          loader = re.sub(r"prime-communes-1\.1\.5\.css\?v=\d+", 'prime-communes-1.1.5.css?v=9', loader)
          loader = re.sub(r"prime-communes-stats-1\.2\.css\?v=\d+", 'prime-communes-stats-1.2.css?v=11', loader)
          loader = re.sub(r"prime-communes-maplibre-1\.2\.js\?v=\d+", 'prime-communes-maplibre-1.2.js?v=10', loader)
          loader = re.sub(r"prime-communes-communes-1\.2\.js\?v=\d+", 'prime-communes-communes-1.2.js?v=5', loader)
          loader_path.write_text(loader)

          # Update tests to protect the canonical rules, not the retired lake-prone file.
          test_path = Path('cities/tests/stabilization-1.1.test.mjs')
          tests = test_path.read_text()
          tests = tests.replace("  assert.match(js, /COUNTRY_BORDER_URL = 'public\\/data\\/switzerland-border-2026\\.geojson'/);\n  assert.match(js, /countryBorderPromise = fetch/);\n  assert.doesNotMatch(js, /buildCountryBorderGeoJSON/);",
                                "  assert.doesNotMatch(js, /COUNTRY_BORDER_URL|countryBorderPromise/);\n  assert.match(js, /buildCountryBorderGeoJSON/);\n  assert.match(js, /exteriorRings/);\n  assert.match(js, /ringSignedArea/);")
          tests = re.sub(r"\ntest\('official national border is a stored swissBOUNDARIES3D 2026 geometry',[\s\S]*?\n\}\);\s*$", "\n", tests, count=1)
          # Add semantic table contract to existing hosting test area.
          needle = "  assert.match(js, /commune\\.hosting \\|\\| '—'/);\n});"
          repl = "  assert.match(js, /commune\\.hosting \\|\\| '—'/);\n  assert.match(js, /decorateEmptyCells/);\n  const css = await read('app/prime-communes-1.1.5.css');\n  assert.match(css, /--pc-table-empty/);\n  assert.match(css, /\\.cell-empty/);\n});"
          if needle in tests:
              tests = tests.replace(needle, repl, 1)
          # Compact + neutral contract.
          tests = tests.replace("  assert.match(css, /\\.stats-kpi:not\\(\\.stats-kpi-prime\\)>strong[\\s\\S]*color:#f3f6fa/);",
                                "  assert.match(css, /--pc-kpi-neutral:#f3f6fa/);\n  assert.match(css, /height:auto/);\n  assert.match(css, /color:var\\(--pc-kpi-neutral\\)/);")
          test_path.write_text(tests)
          PY

          rm -f cities/public/data/switzerland-border-2026.geojson

      - name: Run checks
        working-directory: cities
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit canonical cleanup and remove one-time workflow
        shell: bash
        run: |
          rm .github/workflows/prime-communes-onetime-front-cleanup.yml
          git config user.name "Prime Communes Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Unify stats and table styling and fix national border"
          git push
