name: Prime Communes one-time front cleanup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prime-communes-onetime-front-cleanup.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply canonical cleanup
        shell: bash
        run: |
          echo '__B64__' | base64 -d > /tmp/cleanup.py
          python /tmp/cleanup.py

      - name: Run checks
        working-directory: cities
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit canonical cleanup
        shell: bash
        run: |
          rm .github/workflows/prime-communes-onetime-front-cleanup.yml
          git config user.name "Prime Communes Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Unify stats and table styling and fix national border"
          git push
".replace("__B64__