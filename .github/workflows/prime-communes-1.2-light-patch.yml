name: Prime Communes 1.2 light map patch

on:
  push:
    paths:
      - '.github/workflows/prime-communes-1.2-light-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cities/package-lock.json

      - name: Build light swisstopo base
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageEnhance, ImageOps, ImageStat
          from pathlib import Path

          src = Path('cities/public/swiss-base.webp')
          dst = Path('cities/public/swiss-base-light.webp')
          im = Image.open(src).convert('RGB')
          before = ImageStat.Stat(im.convert('L')).mean[0]
          if before < 145:
              im = ImageOps.invert(im)
          im = ImageEnhance.Color(im).enhance(0.72)
          im = ImageEnhance.Contrast(im).enhance(0.90)
          im = ImageEnhance.Brightness(im).enhance(1.04)
          after = ImageStat.Stat(im.convert('L')).mean[0]
          im.save(dst, 'WEBP', quality=89, method=6)
          print(f'Basemap luminance: {before:.1f} -> {after:.1f}')
          PY

      - name: Patch Carte 1.2 visual system
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('cities/app/prime-communes-maplibre-poc.js')
          js = js_path.read_text(encoding='utf-8')
          replacements = {
            "local.href = 'app/prime-communes-maplibre-poc.css?v=2';": "local.href = 'app/prime-communes-maplibre-poc.css?v=3';",
            "map.addSource('swisstopo-base', { type: 'image', url: 'public/swiss-base.webp', coordinates: imageCoordinates });": "map.addSource('swisstopo-base', { type: 'image', url: 'public/swiss-base-light.webp?v=1', coordinates: imageCoordinates });",
            "paint: { 'raster-opacity': 1, 'raster-brightness-min': 0.24, 'raster-brightness-max': 0.98, 'raster-contrast': -0.15, 'raster-saturation': -0.08 }": "paint: { 'raster-opacity': 1, 'raster-brightness-min': 0.04, 'raster-brightness-max': 1, 'raster-contrast': -0.06, 'raster-saturation': -0.10 }",
            "'line-color': 'rgba(236,247,252,.98)',\n        'line-opacity': ['interpolate', ['linear'], ['zoom'], 6, 0.08, 8, 0.25, 10, 0.68, 12, 0.94],\n        'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.22, 8, 0.42, 10, 0.9, 12, 1.5]": "'line-color': 'rgba(34,62,80,.78)',\n        'line-opacity': ['interpolate', ['linear'], ['zoom'], 6, 0.06, 8, 0.20, 10, 0.52, 12, 0.80],\n        'line-width': ['interpolate', ['linear'], ['zoom'], 6, 0.18, 8, 0.36, 10, 0.82, 12, 1.35]"
          }
          for old, new in replacements.items():
              if old not in js:
                  raise SystemExit(f'Missing JS contract: {old[:80]}')
              js = js.replace(old, new, 1)
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('cities/app/prime-communes-maplibre-poc.css')
          css = css_path.read_text(encoding='utf-8')
          old_stats = """.maplibre-metric{\n  min-width:0;\n  padding:14px 16px;\n  border:1px solid rgba(96,183,235,.16);\n  border-radius:16px;\n  background:linear-gradient(135deg,rgba(16,45,65,.80),rgba(28,26,52,.72));\n  box-shadow:inset 0 1px rgba(255,255,255,.035);\n}\n.maplibre-metric p{margin:0 0 6px;color:#79c9f5;font-size:9px;font-weight:850;letter-spacing:.14em;text-transform:uppercase}\n.maplibre-metric strong{display:block;color:#f2f6fa;font-size:23px;line-height:1.05;letter-spacing:-.035em}\n.maplibre-metric span{display:block;margin-top:6px;color:#9cacbc;font-size:10px;line-height:1.45}\n.maplibre-metric small{display:block;margin-top:4px;color:#718499;font-size:9px;line-height:1.4}\n"""
          new_stats = """.maplibre-metric{\n  min-width:0;\n  min-height:142px;\n  padding:22px;\n  border:1px solid rgba(255,255,255,.075);\n  border-radius:20px;\n  background:radial-gradient(circle at 90% 10%,rgba(30,144,225,.20),transparent 46%),linear-gradient(145deg,rgba(9,80,133,.28),rgba(255,255,255,.02));\n  box-shadow:0 18px 45px rgba(0,0,0,.18);\n}\n.maplibre-metric:nth-child(2){background:radial-gradient(circle at 90% 10%,rgba(111,87,255,.15),transparent 48%),linear-gradient(145deg,rgba(12,74,118,.22),rgba(255,255,255,.018))}\n.maplibre-metric p{margin:0;color:#7f8ca0;font-size:10px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}\n.maplibre-metric strong{display:block;margin-top:20px;color:#6ec7ff;font-size:34px;line-height:1;letter-spacing:-.045em}\n.maplibre-metric span{display:block;margin-top:8px;color:#8d9bad;font-size:11px;line-height:1.45}\n.maplibre-metric small{display:block;margin-top:6px;color:#68788d;font-size:9px;line-height:1.4}\n"""
          if old_stats not in css:
              raise SystemExit('Missing metric CSS contract')
          css = css.replace(old_stats, new_stats, 1)
          css = css.replace("background:#26343f;\n  border-radius:0;", "background:#edf2f5;\n  border:1px solid rgba(31,58,77,.12);\n  border-radius:18px 18px 0 0;", 1)
          css = css.replace("#primeMapLibre{position:absolute;inset:0;background:#26343f}", "#primeMapLibre{position:absolute;inset:0;background:#edf2f5}", 1)
          css = css.replace("#primeMapLibre .maplibregl-ctrl-group{overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:11px;background:rgba(14,22,31,.76);box-shadow:0 8px 24px rgba(0,0,0,.18);backdrop-filter:blur(12px)}", "#primeMapLibre .maplibregl-ctrl-group{overflow:hidden;border:1px solid rgba(30,55,73,.16);border-radius:11px;background:rgba(255,255,255,.93);box-shadow:0 8px 24px rgba(23,48,65,.16);backdrop-filter:blur(12px)}", 1)
          css = css.replace("#primeMapLibre .maplibregl-ctrl-group button+button{border-top:1px solid rgba(255,255,255,.10)}", "#primeMapLibre .maplibregl-ctrl-group button+button{border-top:1px solid rgba(30,55,73,.10)}", 1)
          css = css.replace("#primeMapLibre .maplibregl-ctrl-icon{filter:invert(89%) sepia(5%) saturate(430%) hue-rotate(170deg)}", "#primeMapLibre .maplibregl-ctrl-icon{filter:none}", 1)
          css = css.replace("color:#d2efff;\n  background:rgba(12,43,61,.76);", "color:#315f7d;\n  background:rgba(248,251,253,.92);", 1)
          css = css.replace(".maplibre-loading{position:absolute;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:#415467;background:#c7d0d6;font-size:12px}", ".maplibre-loading{position:absolute;z-index:5;inset:0;display:flex;align-items:center;justify-content:center;gap:10px;color:#52687a;background:#edf2f5;font-size:12px}", 1)
          css = css.replace(".maplibre-metric{padding:11px 10px;border-radius:13px}", ".maplibre-metric{min-height:112px;padding:14px 13px;border-radius:16px}", 1)
          css = css.replace(".maplibre-metric p{font-size:7.5px;letter-spacing:.11em}", ".maplibre-metric p{font-size:8px;letter-spacing:.11em}", 1)
          css = css.replace(".maplibre-metric strong{font-size:18px}", ".maplibre-metric strong{margin-top:14px;font-size:22px}", 1)
          css = css.replace(".maplibre-metric span{font-size:8.5px}", ".maplibre-metric span{font-size:9px}", 1)
          css_path.write_text(css, encoding='utf-8')

          loader_path = Path('cities/app/prime-communes-1.1.js')
          loader = loader_path.read_text(encoding='utf-8')
          old = "loadScript('app/prime-communes-maplibre-poc.js?v=2');"
          new = "loadScript('app/prime-communes-maplibre-poc.js?v=3');"
          if old not in loader:
              raise SystemExit('Missing loader contract')
          loader_path.write_text(loader.replace(old, new, 1), encoding='utf-8')

          index_path = Path('cities/index.html')
          index = index_path.read_text(encoding='utf-8')
          old = '<script src="app/prime-communes-1.1.js?v=1"></script>'
          new = '<script src="app/prime-communes-1.1.js?v=2"></script>'
          if old not in index:
              raise SystemExit('Missing index cache contract')
          index_path.write_text(index.replace(old, new, 1), encoding='utf-8')

          test_path = Path('cities/tests/stabilization-1.1.test.mjs')
          tests = test_path.read_text(encoding='utf-8')
          old = r'''assert.match(html, /<script src="app\/prime-communes-1\.1\.js\?v=1"><\/script>/);'''
          new = r'''assert.match(html, /<script src="app\/prime-communes-1\.1\.js\?v=\d+"><\/script>/);'''
          if old not in tests:
              raise SystemExit('Missing loader-version test contract')
          tests = tests.replace(old, new, 1)
          old = r'''assert.match(js, /public\/swiss-base\.webp/);'''
          new = r'''assert.match(js, /public\/swiss-base(?:-light)?\.webp/);'''
          if old not in tests:
              raise SystemExit('Missing swisstopo MapLibre test contract')
          tests = tests.replace(old, new, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY

      - name: Validate 1.2
        working-directory: cities
        run: |
          npm ci
          node --check app/prime-communes-1.1.js
          node --check app/prime-communes-maplibre-poc.js
          npm run check
          npm run build

      - name: Commit validated patch and clean temporary workflows
        run: |
          git rm -f .github/workflows/prime-communes-live-export.yml
          git rm -f .github/workflows/prime-communes-1.2-light-patch.yml
          git config user.name "Prime Communes automation"
          git config user.email "actions@users.noreply.github.com"
          git add cities/app/prime-communes-maplibre-poc.css cities/app/prime-communes-maplibre-poc.js cities/app/prime-communes-1.1.js cities/index.html cities/public/swiss-base-light.webp cities/tests/stabilization-1.1.test.mjs
          git commit -m "Refine Carte 1.2 light professional map"
          git push origin HEAD:main
