name: Prime Communes canonical UI and official border

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prime-communes-canonical-ui-border.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare official swissBOUNDARIES3D source
        run: |
          python -m pip install --quiet geopandas pyogrio shapely pyproj
          wget -q https://data.geo.admin.ch/ch.swisstopo.swissboundaries3d/swissboundaries3d_2026-01/swissboundaries3d_2026-01_2056_5728.gpkg.zip -O /tmp/swissboundaries.zip
          mkdir -p /tmp/swissboundaries
          unzip -q /tmp/swissboundaries.zip -d /tmp/swissboundaries

      - name: Normalize 2026 field casing and apply canonical migration
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('cities/scripts/canonicalize_ui.py')
          text = path.read_text()
          old = """    if 'ICC' in gdf.columns:
        swiss = gdf[gdf['ICC'].astype(str).str.upper().eq('CH')]
    elif 'NAME' in gdf.columns:
        swiss = gdf[gdf['NAME'].astype(str).str.lower().str.contains('schweiz|suisse|svizzera|switzerland', regex=True)]
    else:
        raise SystemExit(f'No country discriminator in {list(gdf.columns)}')
"""
          new = """    columns = {str(column).upper(): column for column in gdf.columns}
    if 'ICC' in columns:
        field = columns['ICC']
        swiss = gdf[gdf[field].astype(str).str.upper().eq('CH')]
    elif 'NAME' in columns:
        field = columns['NAME']
        swiss = gdf[gdf[field].astype(str).str.lower().str.contains('schweiz|suisse|svizzera|switzerland', regex=True)]
    else:
        raise SystemExit(f'No country discriminator in {list(gdf.columns)}')
"""
          if text.count(old) != 1:
              raise SystemExit('swisstopo field-casing patch not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python cities/scripts/canonicalize_ui.py

      - name: Run checks
        working-directory: cities
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit canonical changes
        run: |
          rm .github/workflows/prime-communes-canonical-ui-border.yml
          rm cities/scripts/canonicalize_ui.py
          git config user.name "Prime Communes Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Canonicalize Stats and use official Swiss border"
          git push
