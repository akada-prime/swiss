name: Prime Communes canonical UI and official border

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prime-communes-canonical-ui-border.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare official swissBOUNDARIES3D 2026 source
        run: |
          python -m pip install --quiet geopandas pyogrio shapely pyproj
          wget -q https://data.geo.admin.ch/ch.swisstopo.swissboundaries3d/swissboundaries3d_2026-01/swissboundaries3d_2026-01_2056_5728.gpkg.zip -O /tmp/swissboundaries.zip
          mkdir -p /tmp/swissboundaries
          unzip -q /tmp/swissboundaries.zip -d /tmp/swissboundaries

      - name: Apply canonical UI migration
        run: python cities/scripts/run_canonicalize.py

      - name: Run checks
        working-directory: cities
        run: |
          npm ci
          npm run check
          npm run build

      - name: Commit canonical changes
        run: |
          rm .github/workflows/prime-communes-canonical-ui-border.yml
          rm cities/scripts/canonicalize_ui.py
          rm cities/scripts/run_canonicalize.py
          git config user.name "Prime Communes Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Canonicalize Stats and use official Swiss border"
          git push
